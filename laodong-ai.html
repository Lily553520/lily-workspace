<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工关系 AI 助手</title>
<link rel="stylesheet" href="assets/style.css">
<style>
body{min-width:900px}
.hidden{display:none!important}
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 64px)}
.msg-list{flex:1;overflow-y:auto;padding:20px 24px;background:#fff;border:1px solid var(--border);border-radius:10px;margin:18px 0}
.msg{display:flex;gap:10px;margin-bottom:16px;max-width:85%}
.msg.user{flex-direction:row-reverse;margin-left:auto}
.msg .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.msg.bot .avatar{background:var(--blue-light)}
.msg.user .avatar{background:#e8f0fa}
.msg .bubble{background:#f5f8fc;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap}
.msg.user .bubble{background:var(--blue);color:#fff;border-color:var(--blue)}
.msg .src{display:block;margin-top:6px;font-size:11.5px;color:var(--muted)}
.msg.user .src{color:rgba(255,255,255,.75)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;transition:.15s;color:var(--text)}
.chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-light)}
.input-row{display:flex;gap:10px}
.input-row input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.input-row input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(33,84,165,.12)}
.ticket-note{font-size:12px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">🤖</div>
    <div class="brand-text">
      <h1>员工关系 AI 助手</h1>
      <p>Quan hệ nhân viên BG · 解答考勤 / 行为 / 保险 / 合同 / CSR thắc mắc của các bộ phận</p>
    </div>
  </div>
  <div class="userbox"><span class="online-dot"></span><span class="uname">GoerMate · AI 助手</span></div>
</header>

<main class="main chat-wrap">
  <div class="chips" id="chips"></div>

  <div class="msg-list" id="msgList"></div>

  <div class="input-row">
    <input type="text" id="qInput" placeholder="Gõ câu hỏi… vd: 旷工 3 天 xử lý thế nào? / 性骚扰 báo ai?">
    <button class="btn btn-blue" id="btnSend">发送</button>
  </div>
  <div class="ticket-note">💡 AI trả lời từ kho 2582 quy định HR (考勤/行为/保险/合同/女职工/CSR). Câu hỏi chưa có đáp án → tự tạo phiếu gửi HR xử lý.</div>
</main>

<script>
(function(){
  // ===== Kho tri thức (từ 2582 quy định HR GoerTek đã đọc) =====
  // Mỗi mục: k = từ khóa (tiếng Trung + tiếng Việt), a = đáp án, s = nguồn
  var KB = [
    // ---- 考勤 (ZZ.7.7.3) ----

      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['迟到','早退','旷工','đi muộn','về sớm','đi trễ','định nghĩa','cúp','bỏ việc','nghỉ không phép','nghỉ ngang','tự ý nghỉ','vắng mặt','vắng không phép','cúp mấy ngày','bỏ việc mấy ngày'],
      a:'⏰ Đi muộn / Về sớm / Cúp (vắng không phép) — ZZ.7.7.3 + ZZ.7.7.7:\n• Đi muộn: đến sau giờ làm trong vòng 30 phút.\n• Về sớm: rời trước giờ tan trong vòng 30 phút.\n• Cúp (vắng không phép): đến muộn trên 30 phút / về sớm trên 30 phút / vắng không lý do.\n• Hậu quả: cúp liên tục 5 ngày, hoặc 30 ngày cộng dồn 5 ngày, hoặc 365 ngày cộng dồn 20 ngày → sa thải (ZZ.7.7.7). Dưới ngưỡng đó (ví dụ cúp 3 ngày) chưa đủ căn cứ sa thải nhưng vẫn bị xử lý kỷ luật theo quy định.',
      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['年假','phép năm','annual leave','12天','nghỉ phép năm','nghỉ năm'],
      a:'🌴 Phép năm (ZZ.7.7.3): tính từ 1/1–31/12 hằng năm, 12 ngày; thâm niên đủ 5 năm +1 ngày, đủ 10 năm +2 ngày.',
      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['请假','nghỉ phép','xin nghỉ','nghỉ lễ','ngày lễ','节假日','lễ','休假','事假','病假','婚假','丧假','护理假','产检假','leave'],
      a:'📋 Loại phép (ZZ.7.7.3): phép việc riêng (trên 15 ngày/năm phải công ty duyệt, tối đa 60 ngày), phép ốm, phép cưới (trong 3 tháng kể từ khi đăng ký), phép tang, phép chăm sóc, phép khám thai, phép thai sản, phép cho con bú…',
      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['加班','tăng ca','overtime','OT','晚加班','休息日加班','làm thêm'],

      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['考勤确认','xác nhận','chấm công xác nhận','打卡','刷脸','iGoer','G-HRMS','xác nhận công'],
      a:'📱 Xác nhận chấm công (ZZ.7.7.3): từ ngày 2–4 hằng tháng, trước 24:00 xác nhận công tháng trước trên iGoer APP hoặc G-HRMS (giờ công/phép/tăng ca). Không xác nhận thì tính lương theo số liệu hệ thống.',
      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['补休','nghỉ bù','换休','调休','nghỉ đổi'],
      a:'🔁 Nghỉ bù (ZZ.7.7.3): tăng ca ngày nghỉ được nghỉ bù trong vòng 6 tháng sau khi tăng ca.',
      s:'ZZ.7.7.3 越南歌尔考勤休假管理制度' },
    { k:['补卡','补刷卡','补刷','bù quẹt thẻ','bù thẻ','quẹt bù','quên quẹt thẻ','quá số lần bù thẻ','bù quẹt thẻ mấy lần','bù thẻ bao nhiêu lần','bù quẹt thẻ 5 lần'],
      a:'💳 Bù quẹt thẻ / 补卡（ZZ.7.7.3）：\n• Bù quẹt thẻ do nguyên nhân cá nhân: mỗi tháng tối đa 4 lần.\n• Vượt quá 4 lần (từ lần thứ 5) → xử lý theo 《越南歌尔员工行为规范及奖惩管理规定》(ZZ.7.7.7) — có thể bị kỷ luật / xử phạt.\n• Phải tự đăng ký xử lý bất thường chấm công trên G-HRMS / iGoer; không được nhờ người khác quẹt hộ hoặc quẹt hộ người khác.',

      a:'⚠️ Các hình thức kỷ luật (từ nhẹ đến nặng, ZZ.7.7.7):\n1) Khiển trách (bằng văn bản); 2) Kéo dài thời hạn tăng lương (≤6 tháng); 3) Cách chức (cán bộ quản lý); 4) Sa thải (chấm dứt hợp đồng, chỉ khi pháp luật cho phép).\n• Trong 3 tháng bị khiển trách rồi tái phạm → kéo dài tăng lương/cách chức; trong 6 tháng tái phạm → sa thải.',

    // ---- 保险 (ZZ.7.7.13) ----
    { k:['保险','bảo hiểm','社保','BHXH','BHYT','BHTN','bảo hiểm xã hội'],
      a:'🛡️ Bảo hiểm (ZZ.7.7.13):\n• Bắt buộc: BHXH, BHYT, BHTN, TNLĐ-BNN (tai nạn lao động – bệnh nghề nghiệp).\n• Gồm phép ốm, thai sản, phục hồi, thất nghiệp, tai nạn… theo Luật BHXH Việt Nam.',

    // ---- 劳动合同 (ZZ.7.7.4 / ZZ.7.7.5) ----

      a:'📤 Chấm dứt/thanh lý hợp đồng (ZZ.7.7.4):\n• Chấm dứt: theo ngày thỏa thuận, công ty đề xuất chấm dứt và gửi thông báo.\n• Thanh lý: hết hạn không gia hạn, đến tuổi nghỉ hưu, các trường hợp pháp luật quy định.\n• Văn bản chấm dứt/thanh lý lưu ít nhất 2 năm.',
      s:'ZZ.7.7.4 劳动合同及协议管理制度' },
    { k:['竞业限制','竞业禁止','cấm cạnh tranh','non-compete','离职后不去竞争对手','thỏa thuận cạnh tranh'],
      a:'🔒 Cấm cạnh tranh (ZZ.7.7.9 / ZZ.7.7.5):\n• Đối tượng: quản lý/kỹ thuật bậc 17 trở lên + người có nghĩa vụ bảo mật (nắm công nghệ cốt lõi/khách hàng quan trọng/bí mật kinh doanh).\n• Thời hạn: trong thời gian làm việc + sau khi nghỉ, tối đa ≤2 năm.\n• Vi phạm: hoàn trả tiền bồi thường + nộp phạt 10 lần tổng lương 12 tháng trước khi nghỉ + bồi thường thiệt hại.',
      s:'ZZ.7.7.9 竞业限制管理制度' },

    // ---- 女职工/未成年工 (ZZ.7.7.12) ----
    { k:['女职工','女工','nữ','四期','经期','孕期','哺乳','怀孕','bầu','mang thai','thai kỳ','bảo vệ phụ nữ'],
      a:'👩 Bảo vệ lao động nữ \"bốn kỳ\" (ZZ.7.7.12):\n• Không được từ chối tuyển/sa thải/giảm lương vì lý do kết hôn/mang thai/sinh/con bú.\n• Kỳ kinh: cấm nước lạnh/nhiệt độ thấp/trên cao/lao động nặng.\n• Thai kỳ: được điều chuyển công việc; mang thai đủ 7 tháng không được kéo dài giờ hoặc làm ca đêm.\n• Cho con bú (con dưới 12 tháng): không được kéo dài giờ và ca đêm.',
      s:'ZZ.7.7.12 女职工与未成年工保护管理制度' },
    { k:['未成年工','未满18','vị thành niên','16-18','未成年','lao động vị thành niên','trẻ vị thành niên'],
      a:'🧒 Lao động vị thành niên (16–18 tuổi, ZZ.7.7.12):\n• Khám sức khỏe đầu vào (công ty trả phí) + huấn luyện an toàn 3 cấp trước khi làm.\n• Không được bố trí 18 công việc cấm (bụi/độc hại/trên cao/hầm mỏ/phóng xạ/dễ cháy nổ…).\n• Nguyên tắc không tăng ca, không ca đêm.\n• Khám sức khỏe định kỳ (trước khi làm / đủ 1 năm / đủ 18 tuổi tái khám), đánh giá rủi ro hằng năm.',
      s:'ZZ.7.7.12 女职工与未成年工保护管理制度' },

  function addMsg(text, isUser, src){
    var d = document.createElement('div');
    d.className = 'msg ' + (isUser ? 'user' : 'bot');
    d.innerHTML = '<div class="avatar">'+(isUser?'👤':'🤖')+'</div><div class="bubble">'+escapeHtml(text)+(src?'<span class="src">📄 '+escapeHtml(src)+'</span>':'')+'</div>';
    list.appendChild(d);
    list.scrollTop = list.scrollHeight;
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // Bỏ dấu tiếng Việt + lowercase để khớp chính xác (nghỉ việc == nghi viec)
  function norm(s){
    return String(s).toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/đ/g,'d');
  }

  // ===== Chào hỏi / cảm ơn / hỏi danh tính (trả lời tự nhiên) =====
  var GREETS = [
    { re:/^(alo|a lo|chao|xin chao|hello|hi|hey|chao ban|hi ban)\b/, a:'👋 Chào bạn! Tôi là trợ lý AI quan hệ nhân viên (员工关系 AI 助手) của GoerTek Việt Nam.\n\nTôi có thể giải đáp về: chấm công, nghỉ phép, tăng ca, hợp đồng, khen thưởng - kỷ luật, bảo hiểm, CSR... Bạn cần hỗ trợ gì?' },
    { re:/(cam on|thanks|thank you|thankyou|tks)/, a:'😊 Không có gì! Nếu còn thắc mắc gì cứ hỏi nhé.' },
    { re:/(ban la ai|may la ai|ai day|你是谁)/, a:'🤖 Tôi là trợ lý AI quan hệ nhân viên (员工关系 AI 助手) của GoerTek Việt Nam — giải đáp thắc mắc về chấm công, nghỉ phép, tăng ca, hợp đồng, khen thưởng - kỷ luật, bảo hiểm, CSR...' },
  ];
  function greet(q){
    var t = norm(q).replace(/[^a-z0-9]+/g, ' ').trim();
    for (var i=0;i<GREETS.length;i++){
      if (GREETS[i].re.test(t)) return GREETS[i].a;
    }
    return null;
  }

  function answer(q){
    var t = norm(q);
    var best = null, bestScore = 0;
    for (var i=0;i<KB.length;i++){
      var score = 0;
      for (var j=0;j<KB[i].k.length;j++){
        var kw = norm(KB[i].k[j]);
        if (kw && t.indexOf(kw) >= 0){
          // từ khóa càng dài & càng cụ thể → trọng số càng cao
          score += kw.length;
        }
      }
      if (score > bestScore){ bestScore = score; best = KB[i]; }
    }
    if (best && bestScore > 0){ return best; }
    return null;
  }

  function related(q){
    var t = norm(q);
    var qw = t.split(/[^a-z0-9\u4e00-\u9fff]+/).filter(function(w){ return w.length >= 2; });
    var scored = [];
    for (var i=0;i<KB.length;i++){
      var sc = 0;
      var all = norm(KB[i].k.join(' ') + ' ' + KB[i].a);
      qw.forEach(function(w){ if (all.indexOf(w) >= 0) sc++; });
      if (sc > 0) scored.push({ s: KB[i].s, sc: sc });
    }
    scored.sort(function(a,b){ return b.sc - a.sc; });
    return scored.slice(0, 3).map(function(x){ return x.s; });
  }

  function respond(q){
    addMsg(q, true);
    var g = greet(q);
    if (g){ addMsg(g, false); return; }
    var r = answer(q);
    if (r){
      addMsg(r.a, false, r.s);
    } else {
      var rel = related(q);
      var hint = rel.length ? '\n\n💡 Có thể bạn muốn hỏi về:\n• ' + rel.join('\n• ') : '';
      addMsg('🤔 Tôi chưa tìm thấy đáp án khớp chính xác cho câu hỏi này trong kho quy định.' + hint + '\n\n📩 Nếu vẫn chưa đúng, câu hỏi sẽ được chuyển thành phiếu hỗ trợ gửi HR (quan hệ nhân viên) trả lời.', false);
    }
  }

  function renderChips(){
    SUGGEST.forEach(function(s){
      var c = document.createElement('div');
      c.className = 'chip'; c.textContent = s;
      c.addEventListener('click', function(){ respond(s); });
      chips.appendChild(c);
    });
  }

  document.getElementById('btnSend').addEventListener('click', function(){
    var v = input.value.trim();
    if (!v) return;
    input.value = '';
    respond(v);
  });
  input.addEventListener('keydown', function(e){ if (e.key==='Enter'){ document.getElementById('btnSend').click(); } });

  renderChips();
  addMsg('👋 Xin chào! Tôi là trợ lý AI quan hệ nhân viên.\n\nTôi có thể giải đáp các thắc mắc về:\n• 🕐 考勤 (chấm công, nghỉ phép, tăng ca)\n• 📝 合同 (hợp đồng, 竞业限制, 解除/终止)\n• 🚫 行为/奖惩 (khen thưởng, kỷ luật, sa thải)\n• 🛡️ 保险 (ốm đau, thai sản, thất nghiệp, tai nạn)\n• 👩 女职工/未成年工 (四期保护)\n• ⚖️ CSR (童工, 歧视, 性骚扰, 强迫劳动)\n• 📤 离职 (nghỉ việc)\n\nHãy gõ câu hỏi, hoặc bấm vào câu gợi ý bên dưới 👇', false);
})();
</script>
