<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 可爱提醒</title>
<style>
:root{
  --pink:#ff7bac; --pink-d:#ff5c99; --pink-deep:#e8558a;
  --bg:#fff0f5; --bg2:#ffe4ec; --card:#fff; --line:#ffd6e0;
  --text:#5c3d4a; --gray:#b08b98; --muted:#c9a2b0;
  --mint:#7fd8be; --sky:#8ecae6; --lemon:#ffd670;
  --shadow:0 6px 18px rgba(255,123,172,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","Quicksand","Comic Sans MS",Roboto,"Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#fff0f5,#ffe4ec 60%,#fff0f5);
  color:var(--text);min-height:100vh;
}
.wrap{max-width:1120px;margin:0 auto;padding:26px 16px 70px;position:relative;z-index:1}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#ff9ec4,#ff7bac 55%,#ff8ec4);
  color:#fff;border-radius:24px;padding:22px 26px;box-shadow:var(--shadow);
  margin-bottom:22px;position:relative;overflow:hidden;flex-wrap:wrap;gap:12px;
}
.topbar .brand{display:flex;align-items:center;gap:14px}
.topbar .logo{
  width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  animation:bounce 2.2s infinite ease-in-out;
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.topbar p{font-size:12.5px;opacity:.92;margin-top:4px}
.topbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{background:rgba(255,255,255,.28);padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px}
.sync-badge{background:rgba(255,255,255,.28);padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px}
.topbar .sticker{position:absolute;font-size:30px;opacity:.35}
.topbar .s1{top:8px;right:90px;transform:rotate(12deg)}
.topbar .s2{bottom:6px;right:16px;transform:rotate(-10deg);font-size:24px}

.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);overflow:hidden;
}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1.5px dashed var(--line);background:#fff8fb;flex-wrap:wrap;gap:10px}
.card-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-body{padding:20px}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:700;color:#e8558a;margin-bottom:7px}
.field .req{color:var(--pink-d)}
input[type=date],input[type=time],input[type=text],input[type=email],input[type=search],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;font-size:14px;
  background:#fff6fa;color:var(--text);transition:.15s;font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(255,123,172,.14)}
textarea{resize:vertical;min-height:62px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.btn-pink{background:linear-gradient(135deg,#ff7bac,#ff5c99);color:#fff;box-shadow:0 4px 12px rgba(255,92,153,.35)}
.btn-pink:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,92,153,.45)}
.btn-mint{background:var(--mint);color:#fff;box-shadow:0 4px 12px rgba(127,216,190,.35)}
.btn-mint:hover{transform:translateY(-1px)}
.btn-outline{background:#fff;color:var(--pink-d);border:1.5px solid var(--line)}
.btn-outline:hover{background:#fff0f5}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:11px}
.btn-del{background:#fff0f3;color:var(--pink-d);border:1.5px solid #ffc2d4}
.btn-del:hover{background:var(--pink-d);color:#fff}
.actions{display:flex;gap:10px;margin-top:6px}

.list-tools{display:flex;gap:8px;padding:12px 16px;border-bottom:1.5px dashed var(--line);background:#fffafd;flex-wrap:wrap;align-items:center}
.list-tools input[type=search]{flex:1;min-width:140px;width:auto}
.list-tools select{width:auto;min-width:120px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:11px 12px;background:#fff0f5;color:#e8558a;font-weight:700;font-size:12.5px;border-bottom:1.5px solid var(--line);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px dashed var(--line);vertical-align:middle}
tbody tr:hover{background:#fff6fa}
tbody tr:last-child td{border-bottom:none}
tr.hl-yellow{background:#fffbe6}
tr.hl-yellow:hover{background:#fff3c9}
tr.hl-red{background:#ffecec}
tr.hl-red:hover{background:#ffdede}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag-email{background:#ffe4ec;color:#e8558a}
.tag-sms{background:#e6f8f0;color:#2e9d77}
.tag-app{background:#e8f4fd;color:#4a8fc4}
.tag-other{background:#f6eede;color:#c2992e}
.tag-igoer{background:#eee6fb;color:#7a5bc4}
.title-cell{font-weight:700}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:38px;display:block;margin-bottom:8px;animation:bounce 2.4s infinite}
.muted{color:var(--muted);font-size:12.5px}
.countdown{display:inline-block;font-size:11.5px;color:var(--pink-d);font-weight:700;background:#fff0f5;padding:2px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
.history-note{display:block;margin-top:3px;font-size:11.5px;color:var(--gray)}

.wd-row{display:flex;gap:8px;flex-wrap:wrap}
.wd-chip{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:#fff6fa;color:var(--text);font-size:14px;font-weight:700;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;justify-content:center}
.wd-chip.on{background:linear-gradient(135deg,#ff7bac,#ff5c99);color:#fff;border-color:transparent}

.modal-mask{position:fixed;inset:0;background:rgba(92,61,74,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:20px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1.5px dashed var(--line)}
.modal-head h3{font-size:15px}
.modal-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
.modal-tip{padding:18px;font-size:14px;color:var(--text);line-height:1.6}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;background:#fff8fb;border-top:1.5px dashed var(--line)}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#ff7bac;color:#fff;padding:12px 20px;border-radius:16px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 6px 18px rgba(255,123,172,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:28px}
.footer b{color:#e8558a}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="sticker s1">🌸</span><span class="sticker s2">💖</span>
    <div class="brand">
      <div class="logo">🎀</div>
      <div>
        <h1>可爱提醒</h1>
        <p>每天的小小日程提醒 · 云端同步 · 邮件 / 短信 / iGoer 💌</p>
      </div>
    </div>
    <div class="right">
      <div class="sync-badge" id="syncBadge">💾 仅本地</div>
      <div class="count" id="totalCount">🧸 0 条提醒</div>
    </div>
  </div>

  <div class="grid">

    <!-- Form 添加/编辑 -->
    <div class="card">
      <div class="card-head"><h2 id="formTitle">🌸 添加新提醒</h2></div>
      <div class="card-body">
        <div class="field">
          <label>🎀 提醒标题 <span class="req">*</span></label>
          <input type="text" id="fTitle" placeholder="例如：写周报 🐰">
        </div>
        <div class="row2">
          <div class="field">
            <label>📅 日期 <span class="req">*</span></label>
            <input type="date" id="fDate">
          </div>
          <div class="field">
            <label>⏰ 时间 <span class="req">*</span></label>
            <input type="time" id="fTime">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>🔔 提醒方式</label>
            <select id="fMethod">
              <option value="email">📧 邮件</option>
              <option value="sms">📱 短信</option>
              <option value="app">💖 应用通知</option>
              <option value="igoer">💬 iGoer 提醒</option>
              <option value="other">✨ 其他</option>
            </select>
          </div>
          <div class="field">
            <label>📨 接收人 (邮箱/手机)</label>
            <input type="text" id="fTo" placeholder="lily.ngocly@goertek.com">
          </div>
        </div>
        <div class="field">
          <label>🔁 重复</label>
          <select id="fRepeat">
            <option value="once">一次 (不重复)</option>
            <option value="daily">每天</option>
            <option value="weekdays">每周 · 指定星期</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </div>
        <div class="field" id="wdField" style="display:none">
          <label>📆 选择星期 (点选)</label>
          <div class="wd-row" id="wdRow"></div>
        </div>
        <div class="field">
          <label>💬 提醒内容 (可选)</label>
          <textarea id="fContent" placeholder="提醒的短信/邮件内容… 🍓"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-pink btn-block" id="btnAdd">🧸 ＋ 添加到列表</button>
        </div>
        <div class="actions">
          <button class="btn btn-outline btn-block" id="btnCancelEdit" style="display:none">↩ 取消编辑</button>
        </div>
      </div>
    </div>

    <!-- 列表 -->
    <div class="card">
      <div class="card-head">
        <h2 id="listTitle">📋 提醒列表</h2>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-pink btn-sm" id="tabActive">📋 进行中 <span id="cntActive">0</span></button>
          <button class="btn btn-del btn-sm" id="tabHistory">📦 历史 <span id="cntHistory">0</span></button>
          <button class="btn btn-mint btn-sm" id="btnSubmit">💾 提交</button>
        </div>
      </div>
      <div class="list-tools">
        <input type="search" id="fSearch" placeholder="🔍 搜索标题 / 接收人 / 内容">
        <select id="fFilter">
          <option value="all">全部</option>
          <option value="today">今天</option>
          <option value="soon">⏳ 24小时内</option>
          <option value="missed">🔴 今日已过点</option>
        </select>
        <button class="btn btn-outline btn-sm" id="btnExport">📥 导出备份</button>
        <button class="btn btn-outline btn-sm" id="btnImport">📤 导入</button>
      </div>
      <div class="card-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th><th>标题</th><th>时间</th><th>方式</th><th>接收人</th><th style="min-width:170px">操作</th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState" style="display:none"><span class="big">🧸</span>还没有提醒哦 ~<br>在左边添加一个吧 💕</div>
      </div>
    </div>

  </div>

  <div class="footer">数据自动同步至云端 (Supabase) · 点击 <b>💾 提交</b> 发送到提醒服务器 · Made with 💖</div>
</div>

<!-- 确认弹窗 -->
<div class="modal-mask" id="confirmMask">
  <div class="modal">
    <div class="modal-head"><h3>⚠️ 确认操作</h3><button class="modal-x" data-close>✕</button></div>
    <p class="modal-tip" id="confirmMsg"></p>
    <div class="modal-foot">
      <button class="btn btn-outline" id="confirmCancel">取消</button>
      <button class="btn btn-pink" id="confirmOk">确定</button>
    </div>
  </div>
</div>

<input type="file" id="importFileInput" accept=".json" hidden>

<div id="toast"></div>

<script>
(function(){
  var KEY = 'reminder_schedule_v2';
  var WD_NAMES = {1:'一',2:'二',3:'三',4:'四',5:'五',6:'六',7:'日'};
  var list = [];
  var currentTab = 'active'; // 'active' | 'history'
  var editingId = null;

  /* ---------- 基础工具 ---------- */
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function isoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function genId(){ return 'r'+Date.now()+'-'+Math.random().toString(36).slice(2,8); }
  function normalize(r){
    return {
      id: r.id || genId(),
      title: r.title || '', date: r.date || '', time: r.time || '', method: r.method || 'email',
      to: r.to || '', content: r.content || '', repeat: r.repeat || 'once',
      weekdays: Array.isArray(r.weekdays) ? r.weekdays : [],
      archived: !!r.archived, archivedAt: r.archivedAt || null
    };
  }

  /* ---------- 本地存储 ---------- */
  function load(){
    // Gộp dữ liệu từ cả key cũ (reminder_schedule_v1) và key hiện tại (v2) — khôi phục dữ liệu nhắc cũ
    var merged = [];
    try{
      var v1 = JSON.parse(localStorage.getItem('reminder_schedule_v1')||'[]');
      var v2 = JSON.parse(localStorage.getItem('reminder_schedule_v2')||'[]');
      var arr1 = Array.isArray(v1) ? v1 : [];
      var arr2 = Array.isArray(v2) ? v2 : [];
      var seen = {};
      arr1.concat(arr2).forEach(function(r){
        if(r && r.id && !seen[r.id]){ seen[r.id] = true; merged.push(r); }
      });
      if(!merged.length) merged = (arr1.length ? arr1 : arr2);
    }catch(e){ merged = []; }
    list = merged.map(normalize);
  }
  function save(){
    localStorage.setItem(KEY, JSON.stringify(list));
    scheduleCloudSave();
  }

  /* ---------- 云端同步 (Supabase Storage) ---------- */
  var SB = { url:'', key:'' };
  function initCloud(){
    try{ SB.url = (localStorage.getItem('sb_url')||'').replace(/\/+$/,''); SB.key = localStorage.getItem('sb_key')||''; }catch(e){}
  }
  function cloudReady(){ return !!(SB.url && SB.key); }
  function cloudPath(){ return 'reminders/reminders.json'; }
  function setSync(txt){ document.getElementById('syncBadge').textContent = txt; }
  async function cloudLoad(){
    if(!cloudReady()) return null;
    try{
      var r = await fetch(SB.url + '/storage/v1/object/public/files/' + cloudPath(), { cache:'no-store' });
      if(!r.ok) return null;
      var j = await r.json();
      return Array.isArray(j) ? j : null;
    }catch(e){ return null; }
  }
  async function cloudSave(){
    if(!cloudReady()) return false;
    try{
      var h = { apikey: SB.key, Authorization: 'Bearer ' + SB.key, 'Content-Type': 'application/json', 'x-upsert': 'true' };
      var r = await fetch(SB.url + '/storage/v1/object/files/' + cloudPath(), { method:'POST', headers:h, body: JSON.stringify(list) });
      return r.ok;
    }catch(e){ return false; }
  }
  var cloudTimer = null;
  function scheduleCloudSave(){
    if(!cloudReady()) return;
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(function(){
      cloudSave().then(function(ok){ setSync(ok ? '☁️ 已同步' : '⚠️ 同步失败'); });
    }, 800);
  }
  async function syncFromCloud(){
    if(!cloudReady()){ setSync('💾 仅本地'); return; }
    setSync('☁️ 同步中…');
    var remote = await cloudLoad();
    if(remote && remote.length){
      list = remote.map(normalize);
      save();
      setSync('☁️ 已同步');
    } else {
      var ok = await cloudSave();
      setSync(ok ? '☁️ 已同步' : '⚠️ 同步失败');
    }
    render();
  }

  /* ---------- toast / 确认弹窗 ---------- */
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }
  var confirmCb = null;
  function confirmDialog(msg, cb){
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmMask').classList.add('show');
    confirmCb = cb;
  }
  function closeConfirm(){ document.getElementById('confirmMask').classList.remove('show'); confirmCb = null; }

  /* ---------- 显示标签 ---------- */
  function methodTag(m){
    if(m==='email') return '<span class="tag tag-email">📧 邮件</span>';
    if(m==='sms')   return '<span class="tag tag-sms">📱 短信</span>';
    if(m==='app')   return '<span class="tag tag-app">💖 应用</span>';
    if(m==='igoer') return '<span class="tag tag-igoer">💬 iGoer</span>';
    return '<span class="tag tag-other">✨ 其他</span>';
  }
  function wdLabel(wds){
    var arr = (wds && wds.length ? wds : [1,2,3,4,5]).slice().sort(function(a,b){return a-b;});
    return arr.map(function(w){ return WD_NAMES[w] || w; }).join('·');
  }
  function repeatTag(r){
    if(r.repeat==='daily')  return ' <span class="tag tag-igoer">🔁 每天</span>';
    if(r.repeat==='weekly') return ' <span class="tag tag-igoer">🔁 每周</span>';
    if(r.repeat==='monthly') return ' <span class="tag tag-igoer">🔁 每月</span>';
    if(r.repeat==='weekdays') return ' <span class="tag tag-igoer">🔁 每周 · ' + wdLabel(r.weekdays) + '</span>';
    return '';
  }

  /* ---------- 时间计算 ---------- */
  function parseTime(t){ var hh = parseInt((t||'00:00').slice(0,2),10)||0; var mm = parseInt((t||'00:00').slice(3,5),10)||0; return {hh:hh, mm:mm}; }
  function atDate(d, hh, mm){ var x = new Date(d); x.setHours(hh, mm, 0, 0); return x; }

  function firesToday(r){
    var now = new Date();
    if(r.repeat==='once') return r.date === isoDate(now);
    if(r.repeat==='daily') return true;
    if(r.repeat==='weekly'){ return now.getDay() === (new Date(r.date+'T00:00:00')).getDay(); }
    if(r.repeat==='weekdays'){ var set=(r.weekdays&&r.weekdays.length?r.weekdays:[1,2,3,4,5]).map(function(w){return w%7;}); return set.indexOf(now.getDay())>=0; }
    if(r.repeat==='monthly'){ return now.getDate() === (new Date(r.date+'T00:00:00')).getDate(); }
    return false;
  }

  function nextOccurrence(r){
    var t = parseTime(r.time); var now = new Date();
    if(r.repeat==='once'){ return new Date(r.date + 'T' + (r.time||'00:00') + ':00'); }
    var start = new Date(r.date + 'T00:00:00');
    if(r.repeat==='daily'){
      var todayAt = atDate(now, t.hh, t.mm);
      return now.getTime() <= todayAt.getTime() ? todayAt : atDate(addDays(now,1), t.hh, t.mm);
    }
    if(r.repeat==='weekly'){
      var wd0 = start.getDay();
      var cand = atDate(now, t.hh, t.mm);
      var diff = (wd0 - now.getDay() + 7) % 7;
      if(diff===0 && now.getTime() <= cand.getTime()) diff = 0; else if(diff===0) diff = 7;
      return atDate(addDays(now, diff), t.hh, t.mm);
    }
    if(r.repeat==='weekdays'){
      var set = (r.weekdays && r.weekdays.length ? r.weekdays : [1,2,3,4,5]).map(function(w){ return w%7; });
      for(var i=0;i<8;i++){
        var d = addDays(now, i);
        var cand2 = atDate(d, t.hh, t.mm);
        if(set.indexOf(d.getDay())>=0 && cand2.getTime() > now.getTime()) return cand2;
      }
      return atDate(addDays(now,1), t.hh, t.mm);
    }
    if(r.repeat==='monthly'){
      var dom = start.getDate();
      var c = new Date(now.getFullYear(), now.getMonth(), dom, t.hh, t.mm, 0, 0);
      if(c.getTime() <= now.getTime()) c = new Date(now.getFullYear(), now.getMonth()+1, dom, t.hh, t.mm, 0, 0);
      return c;
    }
    return new Date(r.date + 'T' + (r.time||'00:00') + ':00');
  }

  function isMissedToday(r){
    if(r.archived || r.repeat==='once') return false;
    if(!firesToday(r)) return false;
    var t = parseTime(r.time);
    var todayAt = atDate(new Date(), t.hh, t.mm);
    return Date.now() > todayAt.getTime();
  }

  function fmtCountdown(nextMs){
    var diff = nextMs - Date.now();
    if(diff < 0) return '已到点';
    var s = Math.floor(diff/1000);
    var d = Math.floor(s/86400); s %= 86400;
    var h = Math.floor(s/3600); s %= 3600;
    var m = Math.floor(s/60);
    if(d > 0) return d + '天' + h + '时';
    if(h > 0) return h + '时' + m + '分';
    if(m > 0) return m + '分后';
    return Math.max(0, Math.floor(diff/1000)) + '秒后';
  }

  /* ---------- 归档 ---------- */
  function autoArchive(){
    var changed = false;
    list.forEach(function(r){
      if(!r.archived && r.repeat==='once'){
        var dt = new Date(r.date + 'T' + (r.time||'00:00') + ':00');
        if(dt.getTime() < Date.now()){ r.archived = true; r.archivedAt = new Date().toISOString(); changed = true; }
      }
    });
    if(changed) save();
    return changed;
  }

  /* ---------- 查找 / 过滤 ---------- */
  function findById(id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return i; return -1; }
  function activeList(){ return list.filter(function(r){ return !r.archived; }); }
  function historyList(){ return list.filter(function(r){ return r.archived; }); }

  function applyFilters(arr){
    var q = (document.getElementById('fSearch').value||'').trim().toLowerCase();
    var f = document.getElementById('fFilter').value;
    return arr.filter(function(r){
      if(q){
        var hay = ((r.title||'')+' '+(r.to||'')+' '+(r.content||'')+' '+(r.method||'')).toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
      if(currentTab==='active' && f!=='all'){
        if(f==='today'){ if(!firesToday(r)) return false; }
        if(f==='soon'){ var d = nextOccurrence(r).getTime()-Date.now(); if(!(d>=0 && d<=24*3600*1000)) return false; }
        if(f==='missed'){ if(!isMissedToday(r)) return false; }
      }
      return true;
    });
  }

  function setEmpty(show, emoji, html){
    var empty = document.getElementById('emptyState');
    if(!show){ empty.style.display='none'; return; }
    empty.style.display='block';
    empty.innerHTML = '<span class="big">'+emoji+'</span>'+html;
  }

  /* ---------- 渲染 ---------- */
  function render(){
    var body = document.getElementById('listBody');
    var count = document.getElementById('totalCount');
    var a = activeList(), h = historyList();
    document.getElementById('cntActive').textContent = a.length;
    document.getElementById('cntHistory').textContent = h.length;
    count.textContent = '🧸 ' + a.length + ' 条进行中 · ' + h.length + ' 条历史';

    if(currentTab === 'active'){
      document.getElementById('tabActive').className = 'btn btn-pink btn-sm';
      document.getElementById('tabHistory').className = 'btn btn-del btn-sm';
      document.getElementById('listTitle').textContent = '📋 进行中';
      document.getElementById('btnSubmit').style.display = '';
      document.getElementById('fFilter').style.display = '';
      var fa = applyFilters(a);
      if(!fa.length){ body.innerHTML=''; setEmpty(true, '🧸', '没有符合条件的提醒 ~<br>在左边添加一个吧 💕'); return; }
      setEmpty(false);
      body.innerHTML = fa.map(function(r){
        var next = nextOccurrence(r).getTime();
        var diff = next - Date.now();
        var cls = ''; var tag = '';
        if(isMissedToday(r)){ cls = 'hl-red'; tag = ' <span class="tag tag-other" style="background:#ffe0e0;color:#d33">🔴 今日已过点</span>'; }
        else if(diff > 0 && diff <= 24*3600*1000){ cls = 'hl-yellow'; tag = ' <span class="tag tag-other" style="background:#fff3c4;color:#b8860b">⏳ 即将</span>'; }
        var content = r.content ? '<div class="muted">' + esc(r.content) + '</div>' : '';
        var cd = '<span class="countdown" data-next="'+next+'">'+fmtCountdown(next)+'</span>';
        return '<tr class="'+cls+'">' +
          '<td>' + esc(r.date) + '</td>' +
          '<td><div class="title-cell">' + esc(r.title) + '</div>' + content + repeatTag(r) + tag + cd + '</td>' +
          '<td>' + esc(r.time) + '</td>' +
          '<td>' + methodTag(r.method) + '</td>' +
          '<td class="muted">' + esc(r.to || 'lily.ngocly@goertek.com') + '</td>' +
          '<td style="white-space:nowrap">' +
            '<button class="btn btn-outline btn-sm" data-eid="'+r.id+'" title="编辑">✏️</button> ' +
            '<button class="btn btn-del btn-sm" data-aid="'+r.id+'">📦 结束</button> ' +
            '<button class="btn btn-del btn-sm" data-did="'+r.id+'">🗑</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    } else {
      document.getElementById('tabActive').className = 'btn btn-del btn-sm';
      document.getElementById('tabHistory').className = 'btn btn-pink btn-sm';
      document.getElementById('listTitle').textContent = '📦 历史';
      document.getElementById('btnSubmit').style.display = 'none';
      document.getElementById('fFilter').style.display = 'none';
      var fh = applyFilters(h);
      if(!fh.length){ body.innerHTML=''; setEmpty(true, '📦', '还没有历史记录哦 ~<br>结束的提醒会出现在这里 🗂'); return; }
      setEmpty(false);
      body.innerHTML = fh.map(function(r){
        var content = r.content ? '<div class="muted">' + esc(r.content) + '</div>' : '';
        var ended = r.archivedAt ? new Date(r.archivedAt).toLocaleString() : '';
        return '<tr>' +
          '<td>' + esc(r.date) + '</td>' +
          '<td><div class="title-cell">' + esc(r.title) + '</div>' + content + repeatTag(r) +
            '<span class="history-note">🗂 已结束' + (ended ? ' · ' + ended : '') + '</span></td>' +
          '<td>' + esc(r.time) + '</td>' +
          '<td>' + methodTag(r.method) + '</td>' +
          '<td class="muted">' + esc(r.to || 'lily.ngocly@goertek.com') + '</td>' +
          '<td style="white-space:nowrap">' +
            '<button class="btn btn-mint btn-sm" data-rid="'+r.id+'">↩ 恢复</button> ' +
            '<button class="btn btn-del btn-sm" data-did="'+r.id+'">🗑</button>' +
          '</td>' +
        '</tr>';
      }).join('');
    }
  }

  /* ---------- 星期选择 ---------- */
  function renderWdChips(selected){
    var row = document.getElementById('wdRow');
    row.innerHTML = '';
    [1,2,3,4,5,6,7].forEach(function(w){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'wd-chip' + (selected.indexOf(w)>=0 ? ' on' : '');
      b.textContent = WD_NAMES[w];
      b.setAttribute('data-w', w);
      b.addEventListener('click', function(){ b.classList.toggle('on'); });
      row.appendChild(b);
    });
  }
  function selectedWd(){
    var arr = [];
    document.querySelectorAll('#wdRow .wd-chip.on').forEach(function(c){ arr.push(parseInt(c.getAttribute('data-w'),10)); });
    return arr.length ? arr : [1,2,3,4,5];
  }

  /* ---------- 表单操作 ---------- */
  function collectForm(){
    var repeat = document.getElementById('fRepeat').value;
    return {
      title: document.getElementById('fTitle').value.trim(),
      date: document.getElementById('fDate').value,
      time: document.getElementById('fTime').value,
      method: document.getElementById('fMethod').value,
      repeat: repeat,
      weekdays: repeat==='weekdays' ? selectedWd() : [],
      to: document.getElementById('fTo').value.trim() || 'lily.ngocly@goertek.com',
      content: document.getElementById('fContent').value.trim()
    };
  }
  function resetForm(){
    editingId = null;
    document.getElementById('formTitle').textContent = '🌸 添加新提醒';
    document.getElementById('fTitle').value='';
    document.getElementById('fContent').value='';
    document.getElementById('fTo').value='';
    document.getElementById('fRepeat').value='once';
    document.getElementById('wdField').style.display='none';
    renderWdChips([1,2,3,4,5]);
    document.getElementById('btnAdd').textContent='🧸 ＋ 添加到列表';
    document.getElementById('btnCancelEdit').style.display='none';
  }
  function onAddClick(){
    var f = collectForm();
    if(!f.title){ toast('⚠️ 请输入提醒标题 🌸'); document.getElementById('fTitle').focus(); return; }
    if(!f.date){ toast('⚠️ 请选择日期 📅'); return; }
    if(!f.time){ toast('⚠️ 请选择时间 ⏰'); return; }
    if(editingId){
      var i = findById(editingId);
      if(i>=0){
        list[i].title=f.title; list[i].date=f.date; list[i].time=f.time; list[i].method=f.method;
        list[i].repeat=f.repeat; list[i].weekdays=f.weekdays; list[i].to=f.to; list[i].content=f.content;
        save(); render(); resetForm();
        toast('✅ 已保存修改：' + f.title);
      } else { resetForm(); }
    } else {
      list.push({ id: genId(), title:f.title, date:f.date, time:f.time, method:f.method, repeat:f.repeat, weekdays:f.weekdays, to:f.to, content:f.content, archived:false });
      save(); render(); resetForm();
      document.getElementById('fTitle').focus();
      toast('✅ 已添加：' + f.title + ' 🎀');
    }
  }
  function startEdit(id){
    var i = findById(id); if(i<0) return;
    var r = list[i];
    editingId = id;
    document.getElementById('formTitle').textContent = '✏️ 编辑提醒';
    document.getElementById('fTitle').value = r.title;
    document.getElementById('fDate').value = r.date;
    document.getElementById('fTime').value = r.time;
    document.getElementById('fMethod').value = r.method;
    document.getElementById('fRepeat').value = r.repeat;
    document.getElementById('fTo').value = r.to || '';
    document.getElementById('fContent').value = r.content || '';
    if(r.repeat==='weekdays'){
      document.getElementById('wdField').style.display='block';
      renderWdChips(r.weekdays && r.weekdays.length ? r.weekdays : [1,2,3,4,5]);
    } else {
      document.getElementById('wdField').style.display='none';
    }
    document.getElementById('btnAdd').textContent='💾 保存修改';
    document.getElementById('btnCancelEdit').style.display='';
    toast('✏️ 正在编辑：' + r.title);
  }

  /* ---------- 增删/归档 ---------- */
  function archiveItem(id){
    var i = findById(id); if(i<0) return;
    list[i].archived = true; list[i].archivedAt = new Date().toISOString();
    save(); render();
    toast('📦 已结束并移入历史：' + list[i].title);
  }
  function restoreItem(id){
    var i = findById(id); if(i<0) return;
    list[i].archived = false; delete list[i].archivedAt;
    save(); render();
    toast('↩ 已恢复：' + list[i].title);
  }
  function delItem(id){
    var i = findById(id); if(i<0) return;
    var name = list[i].title;
    confirmDialog('确定要删除「' + name + '」吗？删除后无法恢复。', function(){
      var j = findById(id);
      if(j<0) return;
      list.splice(j,1); save(); render();
      toast('🗑 已删除：' + name);
    });
  }

  /* ---------- 导入/导出 ---------- */
  function exportJson(){
    var blob = new Blob([JSON.stringify(list, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reminders-backup-' + isoDate(new Date()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
    toast('📥 已导出备份 (' + list.length + ' 条)');
  }
  function importJson(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var j = JSON.parse(reader.result);
        if(!Array.isArray(j)) throw new Error('文件格式不是提醒数组');
        var mapped = j.map(normalize);
        confirmDialog('导入将用文件中的 ' + mapped.length + ' 条提醒替换当前 ' + list.length + ' 条，确定吗？', function(){
          list = mapped; save(); render();
          toast('✅ 已导入 ' + mapped.length + ' 条提醒');
        });
      }catch(e){ toast('⚠️ 导入失败：' + e.message); }
    };
    reader.readAsText(file);
  }

  /* ---------- 事件绑定 ---------- */
  document.getElementById('btnAdd').addEventListener('click', onAddClick);
  document.getElementById('btnCancelEdit').addEventListener('click', resetForm);
  document.getElementById('tabActive').addEventListener('click', function(){ currentTab='active'; render(); });
  document.getElementById('tabHistory').addEventListener('click', function(){ currentTab='history'; render(); });
  document.getElementById('fRepeat').addEventListener('change', function(){
    document.getElementById('wdField').style.display = (this.value==='weekdays') ? 'block' : 'none';
  });
  document.getElementById('fSearch').addEventListener('input', render);
  document.getElementById('fFilter').addEventListener('change', render);
  document.getElementById('btnExport').addEventListener('click', exportJson);
  document.getElementById('btnImport').addEventListener('click', function(){ document.getElementById('importFileInput').click(); });
  document.getElementById('importFileInput').addEventListener('change', function(){
    if(this.files && this.files[0]){ importJson(this.files[0]); this.value=''; }
  });
  document.getElementById('confirmOk').addEventListener('click', function(){
    var cb = confirmCb; closeConfirm(); if(cb) cb();
  });
  document.getElementById('confirmCancel').addEventListener('click', closeConfirm);
  document.getElementById('confirmMask').addEventListener('click', function(e){ if(e.target===this) closeConfirm(); });
  document.querySelectorAll('#confirmMask [data-close]').forEach(function(x){ x.addEventListener('click', closeConfirm); });

  function submitToServer(items, cb){
    fetch('http://127.0.0.1:8790/reminders', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(items)
    }).then(function(r){ if(r.ok){ return r.json(); } throw new Error('HTTP '+r.status); })
      .then(function(){ cb(true); })
      .catch(function(){ cb(false); });
  }
  document.getElementById('btnSubmit').addEventListener('click', function(){
    save();
    var items = activeList();
    if(!items.length){ toast('🧸 还没有进行中的提醒哦'); return; }
    toast('📤 正在提交到服务器…');
    submitToServer(items, function(ok){
      toast(ok ? ('📬 已提交 ' + items.length + ' 条提醒 → 到点自动发邮件 ✉️') : '⚠️ 无法连接本地提醒服务器 (127.0.0.1:8790) — 请确认服务器已启动');
    });
  });

  document.getElementById('listBody').addEventListener('click', function(e){
    var el;
    if((el = e.target.closest('[data-eid]'))){ startEdit(el.getAttribute('data-eid')); return; }
    if((el = e.target.closest('[data-aid]'))){ archiveItem(el.getAttribute('data-aid')); return; }
    if((el = e.target.closest('[data-rid]'))){ restoreItem(el.getAttribute('data-rid')); return; }
    if((el = e.target.closest('[data-did]'))){ delItem(el.getAttribute('data-did')); return; }
  });

  document.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='fTitle'){ onAddClick(); } });

  /* ---------- 倒计时 + 定时刷新 ---------- */
  function updateCountdowns(){
    document.querySelectorAll('.countdown[data-next]').forEach(function(el){
      el.textContent = fmtCountdown(parseInt(el.getAttribute('data-next'),10));
    });
  }

  /* ---------- 初始化 ---------- */
  var now = new Date();
  document.getElementById('fDate').value = isoDate(now);
  initCloud();
  load();
  autoArchive();
  renderWdChips([1,2,3,4,5]);
  render();
  syncFromCloud();

  setInterval(updateCountdowns, 1000);
  setInterval(function(){
    if(autoArchive()) save();
    render();
  }, 60000);
})();
</script>
</body>
</html>
