<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 可爱提醒</title>
<style>
:root{
  --pink:#ff7bac; --pink-d:#ff5c99; --pink-deep:#e8558a;
  --bg:#fff0f5; --bg2:#ffe4ec; --card:#fff; --line:#ffd6e0;
  --text:#5c3d4a; --gray:#b08b98; --muted:#c9a2b0;
  --mint:#7fd8be; --sky:#8ecae6; --lemon:#ffd670;
  --shadow:0 6px 18px rgba(255,123,172,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Segoe UI","Quicksand","Comic Sans MS",Roboto,"Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#fff0f5,#ffe4ec 60%,#fff0f5);
  color:var(--text);min-height:100vh;
}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;opacity:.5;font-size:26px}
.wrap{max-width:1060px;margin:0 auto;padding:26px 16px 70px;position:relative;z-index:1}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,#ff9ec4,#ff7bac 55%,#ff8ec4);
  color:#fff;border-radius:24px;padding:22px 26px;box-shadow:var(--shadow);
  margin-bottom:22px;position:relative;overflow:hidden;
}
.topbar .brand{display:flex;align-items:center;gap:14px}
.topbar .logo{
  width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  animation:bounce 2.2s infinite ease-in-out;
}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.topbar h1{font-size:20px;font-weight:700;letter-spacing:.3px}
.topbar p{font-size:12.5px;opacity:.92;margin-top:4px}
.topbar .count{background:rgba(255,255,255,.28);padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px}
.topbar .sticker{position:absolute;font-size:30px;opacity:.35}
.topbar .s1{top:8px;right:90px;transform:rotate(12deg)}
.topbar .s2{bottom:6px;right:16px;transform:rotate(-10deg);font-size:24px}

.grid{display:grid;grid-template-columns:1fr 1.45fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--card);border:1.5px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);overflow:hidden;
}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1.5px dashed var(--line);background:#fff8fb}
.card-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-body{padding:20px}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:700;color:#e8558a;margin-bottom:7px}
.field .req{color:var(--pink-d)}
input[type=date],input[type=time],input[type=text],input[type=email],select,textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:14px;font-size:14px;
  background:#fff6fa;color:var(--text);transition:.15s;font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(255,123,172,.14)}
textarea{resize:vertical;min-height:62px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 17px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn-pink{background:linear-gradient(135deg,#ff7bac,#ff5c99);color:#fff;box-shadow:0 4px 12px rgba(255,92,153,.35)}
.btn-pink:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,92,153,.45)}
.btn-mint{background:var(--mint);color:#fff;box-shadow:0 4px 12px rgba(127,216,190,.35)}
.btn-mint:hover{transform:translateY(-1px)}
.btn-block{width:100%}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:11px}
.btn-del{background:#fff0f3;color:var(--pink-d);border:1.5px solid #ffc2d4}
.btn-del:hover{background:var(--pink-d);color:#fff}
.actions{display:flex;gap:10px;margin-top:6px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:11px 12px;background:#fff0f5;color:#e8558a;font-weight:700;font-size:12.5px;border-bottom:1.5px solid var(--line);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px dashed var(--line);vertical-align:middle}
tbody tr:hover{background:#fff6fa}
tbody tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
.tag-email{background:#ffe4ec;color:#e8558a}
.tag-sms{background:#e6f8f0;color:#2e9d77}
.tag-app{background:#e8f4fd;color:#4a8fc4}
.tag-other{background:#f6eede;color:#c2992e}
.tag-igoer{background:#eee6fb;color:#7a5bc4}
.title-cell{font-weight:700}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty .big{font-size:38px;display:block;margin-bottom:8px;animation:bounce 2.4s infinite}
.muted{color:var(--muted);font-size:12.5px}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#ff7bac;color:#fff;padding:12px 20px;border-radius:16px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 6px 18px rgba(255,123,172,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:28px}
.footer b{color:#e8558a}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="sticker s1">🌸</span><span class="sticker s2">💖</span>
    <div class="brand">
      <div class="logo">🎀</div>
      <div>
        <h1>可爱提醒</h1>
        <p>每天的小小日程提醒 · 通过邮件 / 短信 / iGoer 发送 💌</p>
      </div>
    </div>
    <div class="count" id="totalCount">🧸 0 条提醒</div>
  </div>

  <div class="grid">

    <!-- Form 添加 -->
    <div class="card">
      <div class="card-head"><h2>🌸 添加新提醒</h2></div>
      <div class="card-body">
        <div class="field">
          <label>🎀 提醒标题 <span class="req">*</span></label>
          <input type="text" id="fTitle" placeholder="例如：写周报 🐰">
        </div>
        <div class="row2">
          <div class="field">
            <label>📅 日期 <span class="req">*</span></label>
            <input type="date" id="fDate">
          </div>
          <div class="field">
            <label>⏰ 时间 <span class="req">*</span></label>
            <input type="time" id="fTime">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>🔔 提醒方式</label>
            <select id="fMethod">
              <option value="email">📧 邮件</option>
              <option value="sms">📱 短信</option>
              <option value="app">💖 应用通知</option>
              <option value="igoer">💬 iGoer 提醒</option>
              <option value="other">✨ 其他</option>
            </select>
          </div>
          <div class="field">
            <label>📨 接收人 (邮箱/手机)</label>
            <input type="text" id="fTo" placeholder="lily.ngocly@goertek.com">
          </div>
        </div>
        <div class="field">
          <label>💬 提醒内容 (可选)</label>
          <textarea id="fContent" placeholder="提醒的短信/邮件内容… 🍓"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-pink btn-block" id="btnAdd">🧸 ＋ 添加到列表</button>
        </div>
      </div>
    </div>

    <!-- 列表 -->
    <div class="card">
      <div class="card-head">
        <h2>📋 提醒列表</h2>
        <button class="btn btn-mint btn-sm" id="btnSubmit">💾 提交</button>
      </div>
      <div class="card-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th><th>标题</th><th>时间</th><th>方式</th><th>接收人</th><th style="width:70px"></th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState" style="display:none"><span class="big">🧸</span>还没有提醒哦 ~<br>在左边添加一个吧 💕</div>
      </div>
    </div>

  </div>

  <div class="footer">数据保存在浏览器 (localStorage) · 点击 <b>💾 提交</b> 保存 · Made with 💖</div>
</div>

<div id="toast"></div>

<script>
(function(){
  var KEY = 'reminder_schedule_v1';
  var list = [];

  function load(){ try{ list = JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ list=[]; } }
  function save(){ localStorage.setItem(KEY, JSON.stringify(list)); }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function methodTag(m){
    if(m==='email') return '<span class="tag tag-email">📧 邮件</span>';
    if(m==='sms')   return '<span class="tag tag-sms">📱 短信</span>';
    if(m==='app')   return '<span class="tag tag-app">💖 应用</span>';
    if(m==='igoer') return '<span class="tag tag-igoer">💬 iGoer</span>';
    return '<span class="tag tag-other">✨ 其他</span>';
  }

  function render(){
    var body = document.getElementById('listBody');
    var empty = document.getElementById('emptyState');
    var count = document.getElementById('totalCount');
    if(!list.length){ body.innerHTML=''; empty.style.display='block'; count.textContent='🧸 0 条提醒'; return; }
    empty.style.display='none';
    count.textContent = '🧸 ' + list.length + ' 条提醒';
    body.innerHTML = list.map(function(r,i){
      var content = r.content ? '<div class="muted">' + esc(r.content) + '</div>' : '';
      return '<tr>' +
        '<td>' + r.date + '</td>' +
        '<td><div class="title-cell">' + esc(r.title) + '</div>' + content + '</td>' +
        '<td>' + r.time + '</td>' +
        '<td>' + methodTag(r.method) + '</td>' +
        '<td class="muted">' + esc(r.to || 'lily.ngocly@goertek.com') + '</td>' +
        '<td><button class="btn btn-del btn-sm" data-i="'+i+'">🗑 删除</button></td>' +
      '</tr>';
    }).join('');
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function addItem(){
    var title = document.getElementById('fTitle').value.trim();
    var date = document.getElementById('fDate').value;
    var time = document.getElementById('fTime').value;
    var method = document.getElementById('fMethod').value;
    var to = document.getElementById('fTo').value.trim();
    if(!to){ to = 'lily.ngocly@goertek.com'; }
    var content = document.getElementById('fContent').value.trim();

    if(!title){ toast('⚠️ 请输入提醒标题 🌸'); document.getElementById('fTitle').focus(); return; }
    if(!date){ toast('⚠️ 请选择日期 📅'); return; }
    if(!time){ toast('⚠️ 请选择时间 ⏰'); return; }

    list.push({ id:'r'+Date.now()+'-'+Math.random().toString(36).slice(2,8), title:title, date:date, time:time, method:method, to:to, content:content });
    save(); render();
    document.getElementById('fTitle').value='';
    document.getElementById('fContent').value='';
    document.getElementById('fTitle').focus();
    toast('✅ 已添加：' + title + ' 🎀');
  }

  function delItem(i){
    var name = list[i].title;
    list.splice(i,1); save(); render();
    toast('🗑 已删除：' + name);
  }

  document.getElementById('btnAdd').addEventListener('click', addItem);
  function submitToServer(items, cb){
    fetch('http://127.0.0.1:8790/reminders', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(items)
    }).then(function(r){ if(r.ok){ return r.json(); } throw new Error('HTTP '+r.status); })
      .then(function(){ cb(true); })
      .catch(function(){ cb(false); });
  }
  document.getElementById('btnSubmit').addEventListener('click', function(){
    save();
    if(!list.length){ toast('🧸 还没有提醒哦'); return; }
    toast('📤 正在提交到服务器…');
    submitToServer(list, function(ok){
      toast(ok ? ('📬 已提交 ' + list.length + ' 条提醒 → 到点自动发邮件 ✉️') : '⚠️ 无法连接本地提醒服务器 (127.0.0.1:8790) — 请确认服务器已启动');
    });
  });
  document.getElementById('listBody').addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]');
    if(b){ delItem(parseInt(b.getAttribute('data-i'),10)); }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='fTitle'){ addItem(); } });

  var today = new Date();
  var iso = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  document.getElementById('fDate').value = iso;

  load(); render();
})();
</script>
</body>
</html>
