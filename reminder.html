<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý nhắc nhở lịch trình</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e6eaf0;
  --blue:#2f6fed; --blue-d:#1e56c9; --green:#16a34a; --red:#e11d48;
  --gray:#6b7280; --text:#1f2937; --muted:#8a94a6;
  --teal:#0d9488; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 60px}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#2f6fed,#0d9488);color:#fff;border-radius:14px;padding:20px 24px;box-shadow:var(--shadow);margin-bottom:20px}
.topbar .brand{display:flex;align-items:center;gap:12px}
.topbar .logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px}
.topbar h1{font-size:20px;font-weight:700}
.topbar p{font-size:12.5px;opacity:.85;margin-top:3px}
.topbar .count{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px}

/* cards */
.grid{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-body{padding:20px}

/* form */
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px}
.field .req{color:var(--red)}
input[type=date],input[type=time],input[type=text],input[type=email],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;
  background:#fafbfd;color:var(--text);transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
textarea{resize:vertical;min-height:64px;font-family:inherit}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-d)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{background:#15803d}
.btn-outline{background:#fff;color:var(--gray);border:1px solid var(--line)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-block{width:100%}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn-danger{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.btn-danger:hover{background:var(--red);color:#fff}
.actions{display:flex;gap:10px;margin-top:6px}

/* list / table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;padding:11px 12px;background:#f7f9fc;color:var(--gray);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#f8fafc}
tbody tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.tag-email{background:#eef4ff;color:var(--blue)}
.tag-sms{background:#eefbf2;color:var(--green)}
.tag-app{background:#f0fdfa;color:var(--teal)}
.tag-other{background:#f4f4f5;color:var(--gray)}
.title-cell{font-weight:600}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13.5px}
.muted{color:var(--muted);font-size:12.5px}

/* toast */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">⏰</div>
      <div>
        <h1>Quản lý nhắc nhở lịch trình</h1>
        <p>Thiết lập nhắc việc tự động · gửi qua Email / Tin nhắn</p>
      </div>
    </div>
    <div class="count" id="totalCount">0 nhắc nhở</div>
  </div>

  <div class="grid">

    <!-- ===== Form thêm mới ===== -->
    <div class="card">
      <div class="card-head"><h2>➕ Thêm nhắc nhở mới</h2></div>
      <div class="card-body">
        <div class="field">
          <label>Tên đề mục nhắc nhở <span class="req">*</span></label>
          <input type="text" id="fTitle" placeholder="Ví dụ: Viết báo cáo tuần">
        </div>
        <div class="row2">
          <div class="field">
            <label>📅 Ngày <span class="req">*</span></label>
            <input type="date" id="fDate">
          </div>
          <div class="field">
            <label>⏰ Thời gian <span class="req">*</span></label>
            <input type="time" id="fTime">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label>🔔 Hình thức nhắc</label>
            <select id="fMethod">
              <option value="email">📧 Email</option>
              <option value="sms">📱 Tin nhắn SMS</option>
              <option value="app">🔔 Thông báo App</option>
              <option value="other">Khác</option>
            </select>
          </div>
          <div class="field">
            <label>📨 Người nhận (email/SĐT)</label>
            <input type="text" id="fTo" placeholder="lily.ngocly@goertek.com">
          </div>
        </div>
        <div class="field">
          <label>💬 Nội dung nhắc (tuỳ chọn)</label>
          <textarea id="fContent" placeholder="Nội dung tin nhắn / email nhắc nhở…"></textarea>
        </div>
        <div class="actions">
          <button class="btn btn-blue btn-block" id="btnAdd">＋ Thêm vào danh sách</button>
        </div>
      </div>
    </div>

    <!-- ===== Danh sách nhắc nhở ===== -->
    <div class="card">
      <div class="card-head">
        <h2>📋 Danh sách nhắc nhở</h2>
        <div class="actions" style="margin:0">
          <button class="btn btn-green btn-sm" id="btnSubmit">💾 提交</button>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ngày</th><th>Tên đề mục</th><th>Giờ</th><th>Hình thức</th><th>Người nhận</th><th style="width:70px"></th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState" style="display:none">Chưa có nhắc nhở nào. Hãy thêm ở bên trái 👈</div>
      </div>
    </div>

  </div>

  <div class="footer">Dữ liệu lưu trên trình duyệt (localStorage) · Nhấn <b>💾 提交</b> để lưu</div>
</div>

<div id="toast"></div>

<script>
(function(){
  var KEY = 'reminder_schedule_v1';
  var list = [];

  function load(){ try{ list = JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ list=[]; } }
  function save(){ localStorage.setItem(KEY, JSON.stringify(list)); }

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function methodTag(m){
    if(m==='email') return '<span class="tag tag-email">📧 Email</span>';
    if(m==='sms')   return '<span class="tag tag-sms">📱 SMS</span>';
    if(m==='app')   return '<span class="tag tag-app">🔔 App</span>';
    return '<span class="tag tag-other">Khác</span>';
  }
  function methodName(m){
    return {email:'Email',sms:'SMS',app:'App'}[m] || 'Khác';
  }

  function render(){
    var body = document.getElementById('listBody');
    var empty = document.getElementById('emptyState');
    var count = document.getElementById('totalCount');
    if(!list.length){ body.innerHTML=''; empty.style.display='block'; count.textContent='0 nhắc nhở'; return; }
    empty.style.display='none';
    count.textContent = list.length + ' nhắc nhở';
    body.innerHTML = list.map(function(r,i){
      var content = r.content ? '<div class="muted">' + esc(r.content) + '</div>' : '';
      return '<tr>' +
        '<td>' + r.date + '</td>' +
        '<td><div class="title-cell">' + esc(r.title) + '</div>' + content + '</td>' +
        '<td>' + r.time + '</td>' +
        '<td>' + methodTag(r.method) + '</td>' +
        '<td class="muted">' + esc(r.to || '—') + '</td>' +
        '<td><button class="btn btn-danger btn-sm" data-i="'+i+'">🗑 Xóa</button></td>' +
      '</tr>';
    }).join('');
  }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  function addItem(){
    var title = document.getElementById('fTitle').value.trim();
    var date = document.getElementById('fDate').value;
    var time = document.getElementById('fTime').value;
    var method = document.getElementById('fMethod').value;
    var to = document.getElementById('fTo').value.trim();
    var content = document.getElementById('fContent').value.trim();

    if(!title){ toast('⚠️ Vui lòng nhập tên đề mục'); document.getElementById('fTitle').focus(); return; }
    if(!date){ toast('⚠️ Vui lòng chọn ngày'); return; }
    if(!time){ toast('⚠️ Vui lòng chọn thời gian'); return; }

    list.push({ title:title, date:date, time:time, method:method, to:to, content:content });
    save(); render();
    // reset form (giữ ngày/giờ cho tiện thêm tiếp)
    document.getElementById('fTitle').value='';
    document.getElementById('fContent').value='';
    document.getElementById('fTitle').focus();
    toast('✅ Đã thêm: ' + title);
  }

  function delItem(i){
    var name = list[i].title;
    list.splice(i,1); save(); render();
    toast('🗑 Đã xóa: ' + name);
  }

  document.getElementById('btnAdd').addEventListener('click', addItem);
  document.getElementById('btnSubmit').addEventListener('click', function(){ save(); toast('💾 Đã lưu ' + list.length + ' nhắc nhở'); });
  document.getElementById('listBody').addEventListener('click', function(e){
    var b = e.target.closest('button[data-i]');
    if(b){ delItem(parseInt(b.getAttribute('data-i'),10)); }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='fTitle'){ addItem(); } });

  // mặc định ngày hôm nay
  var today = new Date();
  var iso = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  document.getElementById('fDate').value = iso;

  load(); render();
})();
</script>
</body>
</html>
